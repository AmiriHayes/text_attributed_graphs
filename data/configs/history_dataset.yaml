# configs/history_dataset.yaml
dataset: history
has_secondary_id: false              # N8 unavailable for this dataset
has_structural_edges: true           # E10d from structural_edges column
embedding_prefix: book                 # book_embeddings.npy (T12b)
contextual_embedding_available: true   # book_embeddings_contextual.npy (T12a)
secondary_embedding_prefix: null
aggregate_embedding_prefix: category   # category_embeddings.npy + category_index.json
# M2 target: local z-score — (price_i - mean_N(i)) / (std_N(i) + eps)
# Provably hard for MLP (requires neighbourhood aggregation). Moran's I is
# negative by construction (high-price node pulls neighbours' targets down),
# but the task itself has genuine GNN structural advantage.
m2_transform: local_zscore
# E11b structural-similarity k-NN parameter (pre-publication audit FIX 3).
# k=50 default degenerated into near-complete graphs under centrality-tie
# clustering. k=5 empirically validated on
# ArXiv/N7/T12a (RAGAS 0.359->0.639, raw_gnn unchanged p=0.302).
k_structural: 5
dataset_characterization:
  secondary_id_singleton_fraction: null
  secondary_id_real_hubs: 0
  n8_viable: false
  categorical_label_unique: 12
  categorical_label_majority_fraction: 0.5608
  m1_viable: true
  aggregate_id_ratio: 0.0006
  n9_viable: true
  text_fidelity_b_distinct: true
  e11b_degree_zero_fraction: null
  warnings:
  - 'NO_SECONDARY_ID: secondary_id is null for all rows'
  recommended_exclusions:
  - SKIP_N8
  characterized_on: '2026-09-12'
preprocessing:
  preprocess_meta_join: false
  preprocess_consolidate_categories: false
  consolidation_threshold: 50
  consolidation_target: 20
  consolidation_drop_tail: false
