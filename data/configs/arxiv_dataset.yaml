# configs/arxiv_dataset.yaml
dataset: arxiv
has_secondary_id: true              # N8 = authors
has_structural_edges: false         # no E10d
secondary_id_is_list: true          # secondary_id = list of author strings per paper
embedding_prefix: article            # article_embeddings.npy (T12b)
contextual_embedding_available: true # article_embeddings_contextual.npy (T12a)
secondary_embedding_prefix: author    # author_embeddings.npy + author_index.json
aggregate_embedding_prefix: category  # category_embeddings.npy + category_index.json
# M2 scalar label source.  'derived_from_text' means abstract character length:
#   len(text_fidelity_a) - len(text_fidelity_b)  (i.e. len(title+abstract) - len(title))
# Prior label was graph_centrality = normalized (PageRank+clustering+degree)/3,
# which was ~91% predictable from node degree alone — graph leakage that does not
# discriminate between construction choices.  Abstract length is external to graph
# structure, varies substantially across papers, and is already in the stored schema.
m2_source: derived_from_text
# E11b structural-similarity k-NN parameter (pre-publication audit FIX 3).
# k=50 default degenerated into near-complete graphs under centrality-tie
# clustering. k=5 empirically validated on
# ArXiv/N7/T12a (RAGAS 0.359->0.639, raw_gnn unchanged p=0.302).
k_structural: 5

# N8 minimum_hub_size (pre-publication audit FIX 4): filters N8 nodes to
# those with >= this many associated N7 nodes. Default 1 = no filtering
# (current/original behavior; 87-98% of N8 nodes are singletons at this
# setting). Finding: no value >=2 keeps enough
# nodes at 1000-row GNN-training-sample scale for Amazon; min_hub_size=2-3
# is viable at the larger pooled GraphRAG-graph scale only. Left at 1 here
# pending the targeted pooled-scale rerun (see rerun plan).
minimum_hub_size: 1
dataset_characterization:
  secondary_id_singleton_fraction: 0.9798
  secondary_id_real_hubs: 59
  n8_viable: true
  categorical_label_unique: 18
  categorical_label_majority_fraction: 0.204
  m1_viable: true
  aggregate_id_ratio: 0.0006
  n9_viable: true
  text_fidelity_b_distinct: true
  e11b_degree_zero_fraction: 0.9933
  warnings:
  - 'WARN Check1: secondary_id singleton fraction 98.0% > 85% (N8 nodes mostly identical
    to N7)'
  - 'WARN Check6: 99.3% of nodes have E10b-co-participation degree 0 (> 30%) -- E11b
    k-NN-on-centrality risks degenerating under these tie conditions'
  recommended_exclusions: []
  characterized_on: '2026-09-12'
preprocessing:
  preprocess_meta_join: false
  preprocess_consolidate_categories: false
  consolidation_threshold: 50
  consolidation_target: 20
  consolidation_drop_tail: false
